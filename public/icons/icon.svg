<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="drumHead" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Círculo externo brilhante -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#redGrad)" stroke-width="12" filter="url(#glow)" opacity="0.8" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#redGrad)" stroke-width="12" />

  <!-- Pulso rítmico / Barras de andamento estilo DJ -->
  <rect x="110" y="238" width="12" height="36" rx="6" fill="#f43f5e" opacity="0.6" />
  <rect x="134" y="222" width="12" height="68" rx="6" fill="#f43f5e" opacity="0.8" />
  <rect x="366" y="222" width="12" height="68" rx="6" fill="#f43f5e" opacity="0.8" />
  <rect x="390" y="238" width="12" height="36" rx="6" fill="#f43f5e" opacity="0.6" />

  <!-- Tambor / Caixa de Percussão -->
  <!-- Corpo do Tambor -->
  <path d="M166 230 L166 310 C166 352 346 352 346 310 L346 230 Z" fill="url(#redGrad)" />
  
  <!-- Hastes de Afinação do Tambor -->
  <line x1="202" y1="240" x2="202" y2="330" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7" />
  <line x1="256" y1="245" x2="256" y2="335" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9" />
  <line x1="310" y1="240" x2="310" y2="330" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7" />

  <!-- Pele Inferior (Sombra) -->
  <ellipse cx="256" cy="310" rx="90" ry="26" fill="#9f1239" opacity="0.5" />

  <!-- Aro Superior e Pele do Tambor -->
  <ellipse cx="256" cy="230" rx="94" ry="30" fill="url(#redGrad)" />
  <ellipse cx="256" cy="228" rx="88" ry="26" fill="url(#drumHead)" />
  <ellipse cx="256" cy="228" rx="72" ry="20" fill="none" stroke="#cbd5e1" stroke-width="2" opacity="0.6" />

  <!-- Baquetas Cruzadas de Percussão -->
  <g stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.95">
    <!-- Baqueta 1 (diagonal) -->
    <line x1="168" y1="140" x2="334" y2="280" />
    <circle cx="168" cy="140" r="10" fill="#ffffff" stroke="none" />

    <!-- Baqueta 2 (diagonal invertida) -->
    <line x1="344" y1="140" x2="178" y2="280" />
    <circle cx="344" cy="140" r="10" fill="#ffffff" stroke="none" />
  </g>

  <!-- Ponto central de impacto sonoro -->
  <circle cx="256" cy="210" r="7" fill="#f43f5e" />
  <circle cx="256" cy="210" r="18" fill="none" stroke="#f43f5e" stroke-width="3" opacity="0.7" />
</svg>
